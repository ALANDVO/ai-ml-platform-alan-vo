[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml-platform-alan-vo"
version = "1.0.0"
description = "AI ML Training Platform with experiment tracking, model registry, hyperparameter optimization, LLM architecture suggestions, and real-time monitoring."
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "python3-saml>=1.15.0",
    "python-multipart>=0.0.6",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "numpy>=1.26.0",
    "aiofiles>=23.2.1",
]
